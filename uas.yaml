affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app: greythr-uas
        topologyKey: kubernetes.io/hostname
    - weight: 2
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app: cougar
        topologyKey: kubernetes.io/hostname
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels:
          app: greythr-uas
      topologyKey: kubernetes.io/hostname

